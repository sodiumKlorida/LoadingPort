<!doctype html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stowage Plan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Penguncian kertas cetak: preview tidak berantakan saat dialog browser
         default ke Letter atau margin yang lebih besar dari A4. -->
    <style>
        @page { size: A4 portrait; margin: 8mm; }
        @media print {
            html, body { background: #fff !important; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        }
    </style>
</head>

<body
    class="min-h-dvh overflow-x-hidden bg-slate-100 font-sans text-slate-900 antialiased selection:bg-sky-200 selection:text-sky-900 lg:h-dvh lg:overflow-hidden print:h-auto print:min-h-0 print:overflow-visible print:bg-white">
        
    <!-- layout preview -->
    <div class="border-2 w-4rem h-4rem">

    </div>

    
</body>

</html>
